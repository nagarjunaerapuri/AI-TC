<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI TC</title>

<!-- Puter.js -->
<script src="https://js.puter.com/v2/"></script>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDEBZ5NLY4PIUsF9D9A6mgqp_IHiY9Gy7c",
  authDomain: "ai-tc-4b59f.firebaseapp.com",
  projectId: "ai-tc-4b59f",
  storageBucket: "ai-tc-4b59f.firebasestorage.app",
  messagingSenderId: "755284292305",
  appId: "1:755284292305:web:07be472337304e93998bf0"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

window.firebaseAuth = auth;
window.googleProvider = provider;
window.signInWithPopup = signInWithPopup;
window.signOut = signOut;

onAuthStateChanged(auth, (user) => {

  const loginScreen = document.getElementById("loginScreen");
  const appScreen = document.getElementById("appScreen");

  if (user) {

    loginScreen.style.display = "none";
    appScreen.style.display = "block";

    document.getElementById("userName").textContent =
      user.displayName || "User";

    document.getElementById("userPhoto").src =
      user.photoURL ||
      "https://www.gstatic.com/images/branding/product/1x/avatar_circle_blue_512dp.png";

  } else {

    loginScreen.style.display = "flex";
    appScreen.style.display = "none";

  }

});

window.googleLogin = async function () {

  try {

    await signInWithPopup(auth, provider);

  } catch (error) {

    alert("Google Login Failed: " + error.message);

  }

};

window.logout = async function () {

  await signOut(auth);

};

</script>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at top, #2b1400, #090909 45%);
  color: white;
  min-height: 100vh;
}

/* LOGIN */

#loginScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.loginBox {
  width: 100%;
  max-width: 420px;
  background: rgba(25,25,25,0.92);
  border: 1px solid rgba(255,105,0,0.3);
  border-radius: 28px;
  padding: 35px 25px;
  text-align: center;
  box-shadow: 0 20px 80px rgba(255,90,0,0.15);
}

.logo {
  width: 70px;
  height: 70px;
  margin: auto;
  border-radius: 22px;
  background: linear-gradient(135deg,#ff6500,#ff9d00);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  font-weight: bold;
  color: white;
  box-shadow: 0 10px 40px rgba(255,100,0,.35);
}

.loginBox h1 {
  margin-top: 22px;
  font-size: 30px;
}

.loginBox p {
  color: #aaa;
  margin: 10px 0 28px;
  line-height: 1.5;
}

.googleBtn {
  width: 100%;
  border: none;
  padding: 15px;
  border-radius: 14px;
  background: white;
  color: #111;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.googleBtn:hover {
  opacity: .9;
}

/* APP */

#appScreen {
  display: none;
  min-height: 100vh;
}

header {
  height: 70px;
  padding: 0 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,.08);
  background: rgba(10,10,10,.8);
  backdrop-filter: blur(20px);
}

.brand {
  font-size: 22px;
  font-weight: bold;
}

.brand span {
  color: #ff7200;
}

.userArea {
  display: flex;
  align-items: center;
  gap: 10px;
}

.userArea img {
  width: 38px;
  height: 38px;
  border-radius: 50%;
}

.logoutBtn {
  background: #222;
  border: 1px solid #333;
  color: white;
  border-radius: 10px;
  padding: 8px 12px;
  cursor: pointer;
}

/* MAIN */

.main {
  width: 100%;
  max-width: 850px;
  margin: auto;
  padding: 25px 16px 50px;
}

.hero {
  text-align: center;
  padding: 25px 0;
}

.hero h2 {
  font-size: clamp(30px,8vw,52px);
  background: linear-gradient(90deg,#fff,#ff8a00);
  -webkit-background-clip: text;
  color: transparent;
}

.hero p {
  color: #999;
  margin-top: 10px;
}

/* CARD */

.generator {
  background: rgba(20,20,20,.9);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 24px;
  padding: 18px;
  box-shadow: 0 20px 70px rgba(0,0,0,.4);
}

.label {
  font-size: 14px;
  color: #aaa;
  margin-bottom: 9px;
}

textarea {
  width: 100%;
  min-height: 150px;
  resize: vertical;
  background: #111;
  border: 1px solid #333;
  color: white;
  border-radius: 16px;
  padding: 16px;
  outline: none;
  font-size: 16px;
  line-height: 1.5;
}

textarea:focus {
  border-color: #ff6b00;
}

/* RATIO */

.ratios {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 9px;
  margin-top: 10px;
}

.ratio {
  background: #151515;
  border: 1px solid #333;
  color: #bbb;
  padding: 12px 5px;
  border-radius: 12px;
  cursor: pointer;
}

.ratio.active {
  background: rgba(255,100,0,.15);
  border-color: #ff6b00;
  color: #ff8a00;
}

/* BUTTON */

.generateBtn {
  width: 100%;
  margin-top: 20px;
  border: none;
  border-radius: 15px;
  padding: 16px;
  background: linear-gradient(90deg,#ff6500,#ff9d00);
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 10px 30px rgba(255,90,0,.25);
}

.generateBtn:disabled {
  opacity: .5;
  cursor: not-allowed;
}

/* RESULT */

.result {
  display: none;
  margin-top: 25px;
}

.result img {
  width: 100%;
  display: block;
  border-radius: 20px;
  border: 1px solid #333;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 12px;
}

.actionBtn {
  padding: 14px;
  border-radius: 13px;
  border: 1px solid #333;
  background: #171717;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

.actionBtn:hover {
  border-color: #ff6500;
}

/* LOADING */

.loading {
  display: none;
  text-align: center;
  padding: 30px;
}

.spinner {
  width: 42px;
  height: 42px;
  border: 4px solid #333;
  border-top-color: #ff6500;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: auto;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.status {
  color: #aaa;
  margin-top: 12px;
}

/* MOBILE */

@media(max-width:500px) {

  header {
    padding: 0 12px;
  }

  .userArea span {
    display: none;
  }

  .main {
    padding: 15px 12px 40px;
  }

  .generator {
    padding: 14px;
  }

}

</style>
</head>

<body>

<!-- LOGIN SCREEN -->

<section id="loginScreen">

  <div class="loginBox">

    <div class="logo">
      AI
    </div>

    <h1>AI TC</h1>

    <p>
      Create stunning AI images from simple prompts.
    </p>

    <button class="googleBtn" onclick="googleLogin()">
      Continue with Google
    </button>

  </div>

</section>


<!-- APP SCREEN -->

<section id="appScreen">

  <header>

    <div class="brand">
      AI <span>TC</span>
    </div>

    <div class="userArea">

      <span id="userName"></span>

      <img id="userPhoto" src="">

      <button class="logoutBtn" onclick="logout()">
        Logout
      </button>

    </div>

  </header>


  <main class="main">

    <div class="hero">

      <h2>Imagine. Create.</h2>

      <p>
        Turn your ideas into images with AI.
      </p>

    </div>


    <div class="generator">

      <div class="label">
        Main Prompt
      </div>

      <textarea
        id="prompt"
        placeholder="Describe the image you want to create..."
      ></textarea>


      <div class="label" style="margin-top:18px;">
        Aspect Ratio
      </div>

      <div class="ratios">

        <button class="ratio active" data-ratio="1:1">
          1:1
        </button>

        <button class="ratio" data-ratio="16:9">
          16:9
        </button>

        <button class="ratio" data-ratio="9:16">
          9:16
        </button>

        <button class="ratio" data-ratio="4:5">
          4:5
        </button>

        <button class="ratio" data-ratio="3:2">
          3:2
        </button>

        <button class="ratio" data-ratio="2:3">
          2:3
        </button>

      </div>


      <button
        class="generateBtn"
        id="generateBtn"
        onclick="generateImage()"
      >
        ✨ Generate Image
      </button>


      <div class="loading" id="loading">

        <div class="spinner"></div>

        <div class="status">
          Creating your image...
        </div>

      </div>


      <div class="result" id="result">

        <img id="resultImage" src="" alt="Generated Image">

        <div class="actions">

          <button
            class="actionBtn"
            onclick="regenerateImage()"
          >
            🔄 Regenerate
          </button>

          <button
            class="actionBtn"
            onclick="downloadImage()"
          >
            ⬇ Download
          </button>

        </div>

      </div>

    </div>

  </main>

</section>


<script>

let selectedRatio = "1:1";
let lastPrompt = "";


/* RATIO */

document.querySelectorAll(".ratio").forEach(button => {

  button.addEventListener("click", () => {

    document.querySelectorAll(".ratio")
      .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    selectedRatio = button.dataset.ratio;

  });

});


/* GENERATE */

async function generateImage() {

  const prompt =
    document.getElementById("prompt").value.trim();

  if (!prompt) {

    alert("Please enter a prompt.");

    return;

  }

  lastPrompt = prompt;

  const btn =
    document.getElementById("generateBtn");

  const loading =
    document.getElementById("loading");

  const result =
    document.getElementById("result");

  const resultImage =
    document.getElementById("resultImage");


  btn.disabled = true;

  loading.style.display = "block";

  result.style.display = "none";


  try {

    /*
      Puter.js image generation
    */

    const image =
      await puter.ai.txt2img(prompt, {
        ratio: selectedRatio
      });


    if (!image) {

      throw new Error(
        "No image was returned."
      );

    }


    let imageUrl = image;


    if (typeof image === "object") {

      imageUrl =
        image.url ||
        image.imageUrl ||
        image.src ||
        image.data;

    }


    if (!imageUrl) {

      throw new Error(
        "Image URL was not returned."
      );

    }


    resultImage.src = imageUrl;

    result.style.display = "block";


  } catch (error) {

    console.error(error);

    alert(
      "Image generation failed:\n\n" +
      (error.message || error)
    );

  } finally {

    btn.disabled = false;

    loading.style.display = "none";

  }

}


/* REGENERATE */

function regenerateImage() {

  if (lastPrompt) {

    document.getElementById("prompt").value =
      lastPrompt;

    generateImage();

  }

}


/* DOWNLOAD */

async function downloadImage() {

  const imageUrl =
    document.getElementById("resultImage").src;

  if (!imageUrl) {

    alert("Generate an image first.");

    return;

  }


  try {

    const response =
      await fetch(imageUrl);

    const blob =
      await response.blob();

    const url =
      URL.createObjectURL(blob);

    const link =
      document.createElement("a");

    link.href = url;

    link.download =
      "AI-TC-image.png";

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);

  } catch {

    window.open(imageUrl, "_blank");

  }

}

</script>

</body>
</html>
