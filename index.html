<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI TC</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,sans-serif;
background:#080808;
color:#fff;
min-height:100vh
}
button{font-family:inherit}
#loginPage{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px
}
.box{
width:100%;
max-width:420px;
background:#141414;
padding:30px 22px;
border-radius:22px;
border:1px solid #ff790055;
text-align:center
}
.logo{
font-size:38px;
font-weight:900;
color:#ff7900;
margin-bottom:10px
}
.box p{color:#999;margin:10px 0 25px}
.google{
width:100%;
padding:15px;
border:0;
border-radius:12px;
font-weight:bold;
font-size:16px;
cursor:pointer
}
#appPage{display:none}
header{
height:64px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 16px;
background:#101010;
border-bottom:1px solid #292929
}
.logo2{
font-size:24px;
font-weight:900;
color:#ff7900
}
.logout{
background:#1b1b1b;
color:#fff;
border:1px solid #333;
padding:9px 13px;
border-radius:9px
}
.container{
max-width:850px;
margin:auto;
padding:25px 15px 50px
}
.hero{text-align:center;margin-bottom:25px}
.hero h1{font-size:30px;margin-bottom:8px}
.orange{color:#ff7900}
.hero p{color:#999}
.card{
background:#121212;
border:1px solid #292929;
border-radius:18px;
padding:18px;
margin-bottom:20px
}
label{
display:block;
font-weight:bold;
margin-bottom:10px
}
textarea{
width:100%;
height:160px;
background:#080808;
border:1px solid #333;
border-radius:13px;
padding:14px;
color:white;
font-size:16px;
resize:vertical;
outline:none
}
textarea:focus{border-color:#ff7900}
.ratios{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:9px
}
.ratio{
padding:12px 5px;
background:#191919;
border:1px solid #333;
color:#ddd;
border-radius:10px
}
.ratio.active{
background:#ff7900;
color:#111;
border-color:#ff7900;
font-weight:bold
}
.generate{
width:100%;
margin-top:18px;
padding:16px;
border:0;
border-radius:13px;
background:linear-gradient(135deg,#ff7900,#ff9d3d);
font-size:18px;
font-weight:900;
cursor:pointer
}
.generate:disabled{opacity:.5}
.status{
display:none;
text-align:center;
color:#aaa;
padding:20px
}
.loader{
width:36px;
height:36px;
margin:auto auto 12px;
border:4px solid #333;
border-top-color:#ff7900;
border-radius:50%;
animation:spin 1s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.result{display:none}
.result img{
width:100%;
display:block;
border-radius:15px
}
.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:12px
}
.action{
padding:13px;
border-radius:10px;
border:1px solid #333;
background:#1a1a1a;
color:#fff;
font-weight:bold
}
.download{
background:#ff7900;
color:#111;
border-color:#ff7900
}
.error{
display:none;
background:#351414;
color:#ffaaaa;
padding:12px;
border-radius:10px;
margin-top:12px
}
@media(max-width:500px){
.hero h1{font-size:25px}
.ratios{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<div id="loginPage">
<div class="box">
<div class="logo">AI TC</div>
<h1>AI Image Generator</h1>
<p>Create advanced AI images from your ideas.</p>
<button class="google" id="googleLogin">
Continue with Google
</button>
</div>
</div>

<div id="appPage">

<header>
<div class="logo2">AI TC</div>
<button class="logout" id="logout">Logout</button>
</header>

<div class="container">

<div class="hero">
<h1>Create with <span class="orange">AI</span></h1>
<p>Turn your prompt into an AI-generated image.</p>
</div>

<div class="card">

<label>Main Prompt</label>

<textarea id="prompt"
placeholder="Describe exactly what you want to create..."></textarea>

<label style="margin-top:18px">Aspect Ratio</label>

<div class="ratios">

<button class="ratio active" data-ratio="1:1">1:1</button>
<button class="ratio" data-ratio="16:9">16:9</button>
<button class="ratio" data-ratio="9:16">9:16</button>
<button class="ratio" data-ratio="4:5">4:5</button>
<button class="ratio" data-ratio="3:2">3:2</button>
<button class="ratio" data-ratio="2:3">2:3</button>

</div>

<button class="generate" id="generate">
✨ Generate Image
</button>

<div class="error" id="error"></div>

</div>

<div class="status" id="status">
<div class="loader"></div>
<div>Creating your image...</div>
</div>

<div class="card result" id="result">

<label>Generated Image</label>

<img id="image">

<div class="actions">

<button class="action download" id="download">
⬇ Download
</button>

<button class="action" id="regenerate">
🔄 Regenerate
</button>

</div>

</div>

</div>
</div>

<script type="module">

import{initializeApp}
from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import{
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged,
signOut
}
from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


const firebaseConfig={
apiKey:"AIzaSyDEBZ5NLY4PIUsF9D9A6mgqp_IHiY9Gy7c",
authDomain:"ai-tc-4b59f.firebaseapp.com",
projectId:"ai-tc-4b59f",
storageBucket:"ai-tc-4b59f.firebasestorage.app",
messagingSenderId:"755284292305",
appId:"1:755284292305:web:07be472337304e93998bf0",
measurementId:"G-NYRMHT1WNT"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const provider=new GoogleAuthProvider();

const loginPage=document.getElementById("loginPage");
const appPage=document.getElementById("appPage");
const googleLogin=document.getElementById("googleLogin");
const logout=document.getElementById("logout");
const prompt=document.getElementById("prompt");
const generate=document.getElementById("generate");
const regenerate=document.getElementById("regenerate");
const status=document.getElementById("status");
const result=document.getElementById("result");
const image=document.getElementById("image");
const download=document.getElementById("download");
const error=document.getElementById("error");

let ratio="1:1";
let currentImage="";


googleLogin.onclick=async()=>{

try{

googleLogin.disabled=true;
googleLogin.textContent="Connecting...";

await signInWithPopup(auth,provider);

}catch(e){

showError("Google login failed.");

googleLogin.disabled=false;
googleLogin.textContent="Continue with Google";

}

};


onAuthStateChanged(auth,user=>{

if(user){

loginPage.style.display="none";
appPage.style.display="block";

}else{

loginPage.style.display="flex";
appPage.style.display="none";

}

});


logout.onclick=()=>signOut(auth);


document.querySelectorAll(".ratio").forEach(btn=>{

btn.onclick=()=>{

document.querySelectorAll(".ratio")
.forEach(x=>x.classList.remove("active"));

btn.classList.add("active");

ratio=btn.dataset.ratio;

};

});


generate.onclick=createImage;
regenerate.onclick=createImage;


async function createImage(){

const text=prompt.value.trim();

if(!text){

showError("Please enter a prompt.");
return;

}

hideError();

generate.disabled=true;
regenerate.disabled=true;

result.style.display="none";
status.style.display="block";

try{

const response=await fetch(
"/.netlify/functions/generate-image",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
prompt:text,
aspectRatio:ratio
})
}
);

const data=await response.json();

if(!response.ok)
throw new Error(data.error||"Generation failed.");

if(!data.image)
throw new Error("No image returned.");

currentImage=data.image;
image.src=currentImage;

status.style.display="none";
result.style.display="block";

result.scrollIntoView({
behavior:"smooth"
});

}catch(e){

status.style.display="none";
showError(e.message);

}finally{

generate.disabled=false;
regenerate.disabled=false;

}

}


download.onclick=()=>{

if(!currentImage)return;

const a=document.createElement("a");

a.href=currentImage;
a.download="AI-TC-image.png";

document.body.appendChild(a);
a.click();
a.remove();

};


function showError(text){

error.textContent=text;
error.style.display="block";

}

function hideError(){

error.style.display="none";

}

</script>

</body>
</html>
